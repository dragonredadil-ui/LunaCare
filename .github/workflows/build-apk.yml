name: Build LunaCare APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        run: flutter create --platforms=android --project-name lunacare .

      - name: Configure Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in s:
              assert "compileOptions {" in s, "compileOptions block not found"
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

          if dependency not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  s += "\n\ndependencies {\n    " + dependency + "\n}\n"

          p.write_text(s)
          print(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaCare-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
